[package]
name = "pmvheaven"
version = "2.2.5"
edition = "2021"
description = "Ad-free PMVHaven desktop client (Dioxus)"
authors = ["PMVHeaven"]

[dependencies]
dioxus = { version = "0.7", features = ["desktop", "router"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
dirs = "6"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
bytes = "1"
url = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
once_cell = "1"
anyhow = "1"
semver = "1"

[features]
default = ["desktop"]
desktop = []

[profile.release]
lto = true
codegen-units = 1
strip = true
