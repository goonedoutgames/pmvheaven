name: Release

# Builds Linux Flatpak + Windows NSIS installer, then creates a GitHub Release
# tagged from Cargo.toml's version (e.g. 2.2.7 → v2.2.7).
#
# Skips when that tag/release already exists so docs-only pushes to main are cheap.
# Bump `[package].version` in Cargo.toml to cut a new release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and recreate the release for the current Cargo.toml version"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match the `dioxus` crate in Cargo.lock (dx warns / can misbehave otherwise).
  DX_VERSION: "0.7.9"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Cargo.toml version
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not parse version from Cargo.toml" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          EXISTS=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTS=true
          elif git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            EXISTS=true
          fi

          if [[ "$EXISTS" == "true" && "$FORCE" != "true" ]]; then
            echo "Release ${TAG} already exists — skipping build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will publish ${TAG}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    name: Build Linux Flatpak
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Generate cargo-sources.json
        run: |
          set -euo pipefail
          chmod +x scripts/gen-cargo-sources.sh
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/gen-cargo-sources.sh
          test -s packaging/flatpak/cargo-sources.json

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: PMVHeaven-${{ needs.version.outputs.version }}-x86_64.flatpak
          manifest-path: packaging/flatpak/com.pmvheaven.Desktop.yml
          cache-key: flatpak-release-${{ github.sha }}
          upload-artifact: false

      - name: Stage Flatpak artifact
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist
          SRC="$(find . -maxdepth 4 -type f -name '*.flatpak' | head -n1)"
          if [[ -z "$SRC" ]]; then
            echo "No Flatpak bundle produced" >&2
            find . -name '*.flatpak' 2>/dev/null | head -20 >&2 || true
            exit 1
          fi
          cp "$SRC" "dist/PMVHeaven-${VERSION}-x86_64.flatpak"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cargo binstall "dioxus-cli@${DX_VERSION}" -y --force --disable-strategies compile
          dx --version

      - name: Bundle NSIS installer
        shell: bash
        run: dx bundle --platform desktop --release --package-types nsis

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist
          SRC="$(find target/dx -type f \( -iname '*setup*.exe' -o -iname '*.exe' \) ! -path '*/deps/*' | head -n1)"
          if [[ -z "$SRC" ]]; then
            echo "No Windows installer exe produced" >&2
            find target/dx -type f | head -200 >&2 || true
            exit 1
          fi
          DEST="dist/PMVHeaven-${VERSION}-x86_64-setup.exe"
          cp "$SRC" "$DEST"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, build-linux, build-windows]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        id: assets
        run: |
          set -euo pipefail
          find artifacts -type f -print
          mapfile -t FILES < <(find artifacts -type f \( -name '*.flatpak' -o -name '*.exe' \) | sort)
          if [[ ${#FILES[@]} -lt 2 ]]; then
            echo "Expected Flatpak + Windows exe; found ${#FILES[@]}" >&2
            exit 1
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find artifacts -type f \( -name '*.flatpak' -o -name '*.exe' \) | sort)

          NOTES=$(printf '%s\n' \
            "## PMVHeaven ${VERSION}" \
            "" \
            "Desktop builds for this release:" \
            "" \
            "- **Linux:** \`PMVHeaven-${VERSION}-x86_64.flatpak\` (install with Flatpak)" \
            "- **Windows:** \`PMVHeaven-${VERSION}-x86_64-setup.exe\`" \
            "" \
            "### Linux install" \
            "" \
            "Needs Flathub + \`org.gnome.Platform//48\` once:" \
            "" \
            '```bash' \
            "flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo" \
            "flatpak install --user -y flathub org.gnome.Platform//48" \
            "flatpak install --user -y ./PMVHeaven-${VERSION}-x86_64.flatpak" \
            "flatpak run com.pmvheaven.Desktop" \
            '```' \
            "" \
            "Source version is taken from \`Cargo.toml\`.")

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$FORCE" == "true" ]]; then
              gh release delete "$TAG" --yes --cleanup-tag || true
            else
              echo "Release already exists and force=false" >&2
              exit 1
            fi
          fi

          gh release create "$TAG" "${FILES[@]}" \
            --title "PMVHeaven ${VERSION}" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"
