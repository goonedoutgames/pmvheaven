# Flatpak manifest — build entirely inside org.gnome.Sdk so WebKitGTK +
# GStreamer come from the runtime (works on Arch/CachyOS/Fedora/Ubuntu alike).
#
# Generate offline crate sources first:
#   ./scripts/gen-cargo-sources.sh
#
# Local build:
#   flatpak-builder --user --install --force-clean build-dir \
#     packaging/flatpak/com.pmvheaven.Desktop.yml

app-id: com.pmvheaven.Desktop
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: pmvheaven
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  # WebKit's inner bwrap sandbox fails inside Flatpak (empty display +
  # "readPIDFromPeer: Unexpected short read from PID socket"). Outer Flatpak
  # sandbox still applies. See WebKitGTK BubblewrapLauncher / glibc memfd issues.
  - --env=WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
  # Prefer Wayland; Dioxus used to force x11 which breaks Flatpak without X11.
  - --env=GDK_BACKEND=wayland
  # Asset resolver looks under lib/$DIOXUS_PRODUCT_NAME/assets on Linux.
  - --env=DIOXUS_PRODUCT_NAME=pmvheaven
modules:
  # muda (dioxus-desktop menus) links libxdo; not in the GNOME SDK by default.
  - name: xdotool
    buildsystem: simple
    build-commands:
      - make PREFIX=/app WITHOUT_RPATH_FIX=1 libxdo.so libxdo.pc
      - make PREFIX=/app WITHOUT_RPATH_FIX=1 installlib installheader installpc
      - |
        set -euo pipefail
        ls -la /app/lib/libxdo* /app/lib/pkgconfig/libxdo.pc
        export PKG_CONFIG_PATH="/app/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
        pkg-config --exists libxdo
        pkg-config --libs libxdo
    sources:
      - type: archive
        url: https://github.com/jordansissel/xdotool/archive/refs/tags/v3.20211022.1.tar.gz
        sha256: 82b15a944a5e82fee15e0f6116bd9f642bc3d0bb6989fc0ca5ad9dfe35de0847

  # Separate module so the app `type: dir` source cannot wipe the dx binary.
  - name: dioxus-cli
    buildsystem: simple
    build-commands:
      - |
        set -euo pipefail
        DX="$(find . -maxdepth 3 -type f -name dx | head -n1)"
        test -n "$DX"
        install -Dm755 "$DX" /app/bin/dx
        /app/bin/dx --version
    sources:
      - type: archive
        url: https://github.com/DioxusLabs/dioxus/releases/download/v0.7.9/dx-x86_64-unknown-linux-gnu.tar.gz
        sha256: 3b132551b480bc96f938f9f0d37936ee1190f994977539dcc347eaf38540d005

  - name: pmvheaven
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/app/bin
      append-pkg-config-path: /app/lib/pkgconfig
      append-ld-library-path: /app/lib
      env:
        CARGO_HOME: /run/build/pmvheaven/cargo
        CARGO_NET_OFFLINE: "true"
        PKG_CONFIG_PATH: /app/lib/pkgconfig
        LIBRARY_PATH: /app/lib
        LD_LIBRARY_PATH: /app/lib
        RUSTFLAGS: "-C link-arg=-L/app/lib"
        DIOXUS_PRODUCT_NAME: pmvheaven
    build-commands:
      - |
        set -euo pipefail
        echo "pre-build checks:"
        ls -la /app/lib/libxdo* /app/bin/dx
        pkg-config --libs libxdo
        dx --version
        # Dioxus asset!() macros require `dx` as the linker/bundler.
        cargo --offline fetch --manifest-path Cargo.toml --verbose
        dx build --platform desktop --release
        BIN="$(find target/dx -type f -name pmvheaven -executable 2>/dev/null | head -n1 || true)"
        if [[ -z "$BIN" ]]; then
          BIN="$(find target -type f -name pmvheaven -executable ! -path '*/deps/*' | head -n1 || true)"
        fi
        test -n "$BIN"
        echo "binary: $BIN"
        install -Dm755 "$BIN" /app/bin/pmvheaven
        # Linux asset root: <prefix>/lib/<product>/assets (dioxus-asset-resolver).
        ASSETS_SRC="$(find target/dx -type d -name assets 2>/dev/null | head -n1 || true)"
        mkdir -p /app/lib/pmvheaven
        if [[ -n "$ASSETS_SRC" && -d "$ASSETS_SRC" ]]; then
          echo "assets from $ASSETS_SRC"
          rm -rf /app/lib/pmvheaven/assets
          cp -a "$ASSETS_SRC" /app/lib/pmvheaven/assets
        else
          echo "WARNING: dx assets dir missing — falling back to source assets/"
          mkdir -p /app/lib/pmvheaven/assets
          cp -a assets/. /app/lib/pmvheaven/assets/
        fi
        ln -sfn ../lib/pmvheaven/assets /app/bin/assets
        ls -la /app/bin/pmvheaven /app/lib/pmvheaven/assets | head -40
        test -d /app/lib/pmvheaven/assets
        test "$(find /app/lib/pmvheaven/assets -type f | wc -l)" -ge 1
        # Do not ship the build-only dx CLI in the runtime app.
        rm -f /app/bin/dx
      - install -Dm644 packaging/flatpak/com.pmvheaven.Desktop.desktop /app/share/applications/com.pmvheaven.Desktop.desktop
      - install -Dm644 packaging/flatpak/com.pmvheaven.Desktop.metainfo.xml /app/share/metainfo/com.pmvheaven.Desktop.metainfo.xml
      - install -Dm644 assets/app-icon-32.png /app/share/icons/hicolor/32x32/apps/com.pmvheaven.Desktop.png
      - install -Dm644 assets/app-icon-128.png /app/share/icons/hicolor/128x128/apps/com.pmvheaven.Desktop.png
      - install -Dm644 assets/app-icon-256.png /app/share/icons/hicolor/256x256/apps/com.pmvheaven.Desktop.png
      - install -Dm644 assets/app-icon-512.png /app/share/icons/hicolor/512x512/apps/com.pmvheaven.Desktop.png
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - .dioxus
          - dist
          - .flatpak-builder
          - build-dir
          - squashfs-root
      - cargo-sources.json
