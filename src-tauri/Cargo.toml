[package]
name = "pmvheaven"
version = "0.1.0"
description = "PMVHeaven desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pmvheaven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Enable MediaSource (needed by hls.js) on the Linux WebKitGTK webview. Version
# and feature pinned to match wry's own webkit2gtk dependency.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
